name: ci
on:
  push:
    branches: [ci_training]
  pull_request:
    branches: [ci_training]
  workflow_dispatch:

jobs:
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_db
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_USER: test_db
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python manage.py test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check .

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: false
          tags: ecommerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max